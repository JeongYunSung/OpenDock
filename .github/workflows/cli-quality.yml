name: CLI Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-check:
    name: CLI full check
    runs-on:
      - self-hosted
      - macOS
      - X64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install macOS native optional bindings
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          arch="$(node -p "process.arch")"
          rolldown_version="$(node -p "require('rolldown/package.json').version")"
          npm install --no-save "@rolldown/binding-darwin-${arch}@${rolldown_version}"

      - name: Verify CLI
        working-directory: packages/cli
        run: bun run check

      - name: Build CLI
        working-directory: packages/cli
        run: bun run build

  cross-platform-smoke:
    name: CLI smoke (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: siba
            runs-on:
              - self-hosted
              - macOS
              - X64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        working-directory: packages/cli
        run: bun run build

      - name: Run signed install/update/uninstall smoke
        working-directory: packages/cli
        run: bun test tests/cli-cross-platform-smoke.test.ts --testTimeout 30000
