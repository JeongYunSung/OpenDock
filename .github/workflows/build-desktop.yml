name: Build Desktop App

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    name: Build desktop app (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    concurrency:
      group: desktop-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: siba
            runs-on:
              - self-hosted
              - macOS
              - X64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Use baseline Bun on siba
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          if bun --revision 2>&1 | grep -q "CPU lacks AVX support"; then
            mkdir -p "$RUNNER_TEMP/bun-baseline"
            curl -fsSL "https://github.com/oven-sh/bun/releases/download/bun-v1.3.11/bun-darwin-x64-baseline.zip" -o "$RUNNER_TEMP/bun-baseline.zip"
            unzip -q -o "$RUNNER_TEMP/bun-baseline.zip" -d "$RUNNER_TEMP/bun-baseline"
            echo "$RUNNER_TEMP/bun-baseline/bun-darwin-x64-baseline" >> "$GITHUB_PATH"
            echo "PATH=$RUNNER_TEMP/bun-baseline/bun-darwin-x64-baseline:$PATH" >> "$GITHUB_ENV"
          fi
          bun --version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install macOS native optional bindings
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          arch="$(node -p "process.arch")"
          rolldown_version="$(node -e "const fs=require('node:fs'); const lock=fs.readFileSync('bun.lock','utf8'); const match=lock.match(/\"rolldown\": \\[\"rolldown@([^\"]+)/); if (!match) process.exit(1); console.log(match[1]);")"
          tauri_cli_version="$(node -e "const fs=require('node:fs'); const lock=fs.readFileSync('bun.lock','utf8'); const match=lock.match(/\"@tauri-apps\\/cli\": \\[\"@tauri-apps\\/cli@([^\"]+)/); if (!match) process.exit(1); console.log(match[1]);")"
          bun add --no-save --os=darwin --cpu="${arch}" \
            "@rolldown/binding-darwin-${arch}@${rolldown_version}" \
            "@tauri-apps/cli-darwin-${arch}@${tauri_cli_version}"

      - name: Build desktop app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run build:desktop

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig

      - name: Upload public release assets
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASES_TOKEN || secrets.GH_PACKAGES_TOKEN || github.token }}
          RELEASE_REPOSITORY: JeongYunSung/OpenDockReleases
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TITLE: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          release_title="${RELEASE_TITLE:-$RELEASE_TAG}"
          notes_file="$(mktemp)"
          printf '%s\n' "$RELEASE_BODY" > "$notes_file"

          release_flags=()
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi

          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$RELEASE_REPOSITORY" \
              --title "$release_title" \
              --notes-file "$notes_file" \
              "${release_flags[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$RELEASE_REPOSITORY" \
              --title "$release_title" \
              --notes-file "$notes_file" \
              "${release_flags[@]}" \
              || gh release edit "$RELEASE_TAG" \
                --repo "$RELEASE_REPOSITORY" \
                --title "$release_title" \
                --notes-file "$notes_file" \
                "${release_flags[@]}"
          fi

          shopt -s nullglob
          assets=(
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
          )
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No desktop release assets were produced."
            exit 1
          fi

          gh release upload "$RELEASE_TAG" \
            --repo "$RELEASE_REPOSITORY" \
            --clobber \
            "${assets[@]}"

  publish-updater-manifest:
    name: Publish updater manifest
    needs: build
    if: github.event_name == 'release'
    runs-on:
      - self-hosted
      - macOS
      - X64
    steps:
      - name: Download desktop release assets
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASES_TOKEN || secrets.GH_PACKAGES_TOKEN || github.token }}
          PUBLIC_RELEASE_REPOSITORY: JeongYunSung/OpenDockReleases
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$PUBLIC_RELEASE_REPOSITORY" \
            --dir release-assets \
            --clobber

      - name: Create latest.json
        env:
          PUBLIC_RELEASE_REPOSITORY: JeongYunSung/OpenDockReleases
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("release-assets")
          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v").removeprefix("V")
          base_url = f"https://github.com/{os.environ['PUBLIC_RELEASE_REPOSITORY']}/releases/download/{tag}"
          platforms = {}

          def first(pattern):
              matches = sorted(root.rglob(pattern))
              return matches[0] if matches else None

          def add_platform(key, asset):
              signature = Path(f"{asset}.sig")
              if not signature.exists():
                  raise SystemExit(f"missing updater signature for {asset.name}")
              platforms[key] = {
                  "signature": signature.read_text(encoding="utf-8").strip(),
                  "url": f"{base_url}/{asset.name}",
              }

          mac_tar = first("*.app.tar.gz")
          if mac_tar is not None:
              add_platform("darwin-aarch64", mac_tar)
              add_platform("darwin-aarch64-app", mac_tar)

          nsis = first("*setup.exe") or first("*.exe")
          if nsis is not None:
              add_platform("windows-x86_64", nsis)
              add_platform("windows-x86_64-nsis", nsis)

          msi = first("*.msi")
          if msi is not None:
              add_platform("windows-x86_64-msi", msi)

          if not platforms:
              raise SystemExit("no updater platforms were found")

          manifest = {
              "version": version,
              "notes": os.environ.get("RELEASE_BODY") or "",
              "pub_date": os.environ.get("RELEASE_PUBLISHED_AT") or None,
              "platforms": platforms,
          }
          Path("latest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASES_TOKEN || secrets.GH_PACKAGES_TOKEN || github.token }}
          PUBLIC_RELEASE_REPOSITORY: JeongYunSung/OpenDockReleases
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" latest.json --repo "${{ github.repository }}" --clobber
          gh release upload "$RELEASE_TAG" latest.json --repo "$PUBLIC_RELEASE_REPOSITORY" --clobber

  cleanup-temporary-artifacts:
    name: Clean temporary workflow artifacts
    needs:
      - build
      - publish-updater-manifest
    if: ${{ always() && github.event_name == 'release' }}
    runs-on:
      - self-hosted
      - macOS
      - X64
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          artifacts="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[]? | select(.expired == false) | [.id, .name] | @tsv')"

          if [ -z "$artifacts" ]; then
            echo "No temporary workflow artifacts to delete."
            exit 0
          fi

          count=0
          while IFS=$'\t' read -r artifact_id artifact_name; do
            if [ -z "$artifact_id" ]; then
              continue
            fi

            echo "Deleting temporary workflow artifact: ${artifact_name} (${artifact_id})"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            count=$((count + 1))
          done <<< "$artifacts"

          echo "Deleted ${count} temporary workflow artifact(s)."
