name: Publish GitHub Package

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

concurrency:
  group: github-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @jeongyunsung/opendock
    runs-on:
      - self-hosted
      - macOS
      - X64
    env:
      OPENDOCK_GITHUB_PACKAGE: "@jeongyunsung/opendock"
      OPENDOCK_GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install macOS native optional bindings
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          arch="$(node -p "process.arch")"
          rolldown_version="$(node -e "const fs=require('node:fs'); const lock=fs.readFileSync('bun.lock','utf8'); const match=lock.match(/\"rolldown\": \\[\"rolldown@([^\"]+)/); if (!match) process.exit(1); console.log(match[1]);")"
          bun add --no-save "@rolldown/binding-darwin-${arch}@${rolldown_version}"

      - name: Verify
        working-directory: packages/cli
        run: bun run check

      - name: Build CLI
        working-directory: packages/cli
        run: bun run build

      - name: Validate GitHub Packages token
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "::error::Set GH_PACKAGES_TOKEN to a classic PAT with write:packages permission for @jeongyunsung packages. GITHUB_TOKEN can only publish packages associated with $GITHUB_REPOSITORY."
            exit 1
          fi

      - name: Prepare GitHub package
        working-directory: packages/cli
        run: bun run prepare:github-package

      - name: Configure GitHub Packages auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          printf '@jeongyunsung:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\nalways-auth=true\n' "$NODE_AUTH_TOKEN" > dist/publish/github/.npmrc

      - name: Verify GitHub Packages auth
        working-directory: dist/publish/github
        run: npm whoami --registry=https://npm.pkg.github.com

      - name: Check existing package version
        id: package-version
        working-directory: dist/publish/github
        env:
          PACKAGE_NAME: ${{ env.OPENDOCK_GITHUB_PACKAGE }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          set +e
          output="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://npm.pkg.github.com 2>&1)"
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Package ${PACKAGE_NAME}@${PACKAGE_VERSION} already exists; skipping publish."
            exit 0
          fi

          if printf '%s' "$output" | grep -Eq 'E404|404 Not Found'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Package ${PACKAGE_NAME}@${PACKAGE_VERSION} does not exist yet; publishing."
            exit 0
          fi

          printf '%s\n' "$output"
          exit "$status"

      - name: Publish
        if: steps.package-version.outputs.exists != 'true'
        working-directory: dist/publish/github
        run: npm publish --registry=https://npm.pkg.github.com
