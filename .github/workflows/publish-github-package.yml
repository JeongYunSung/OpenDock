name: Publish GitHub Package

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish @opendock/cli
    runs-on: ubuntu-latest
    env:
      OPENDOCK_GITHUB_PACKAGE: "@opendock/cli"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run check

      - name: Build CLI
        run: bun run build

      - name: Prepare GitHub package
        run: bun run prepare:github-package

      - name: Configure GitHub Packages auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
        run: |
          printf '@opendock:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > dist/publish/github/.npmrc

      - name: Publish
        working-directory: dist/publish/github
        run: bun publish --registry https://npm.pkg.github.com
