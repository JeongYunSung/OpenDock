opendock: 1
summary: Tool dock for installing Claude Code without project payloads.
readme: DOCK.md
logo: logo.png
tags:
  - claude-code
  - tool
  - ai-agent
requires:
  runtimes:
    node: ">=22.0.0"
    npm: ">=10.0.0"
tools:
  claude-code:
    manager: npm
    package: "@anthropic-ai/claude-code"
    version: latest
    commands:
      - claude
doctor:
  - id: check-claude-code
    run: claude --version
