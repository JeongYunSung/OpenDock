opendock: 1
summary: Project-local runtime versions and validation task references for agents.
readme: DOCK.md
logo: logo.png
tags:
  - developer-tools
  - runtime
  - mise
  - workflow
files:
  - from: files/AGENTS.md
    to: AGENTS.md
  - from: files/CLAUDE.md
    to: CLAUDE.md
  - from: files/GEMINI.md
    to: GEMINI.md
  - from: files/.agents/skills/opendock-dev-env/SKILL.md
    to: .agents/skills/opendock-dev-env/SKILL.md
  - from: files/.codex/skills/opendock-dev-env/SKILL.md
    to: .codex/skills/opendock-dev-env/SKILL.md
  - from: files/.claude/skills/opendock-dev-env/SKILL.md
    to: .claude/skills/opendock-dev-env/SKILL.md
  - from: files/.cursor/rules/opendock-dev-env.mdc
    to: .cursor/rules/opendock-dev-env.mdc
  - from: files/README.md
    to: README.md
  - from: files/mise.toml
    to: mise.toml
  - from: files/.opendock/dev-env.md
    to: .opendock/dev-env.md
doctor:
  - id: agents-md
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath AGENTS.md) { exit 0 } else { exit 1 }"
  - id: claude-md
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath CLAUDE.md) { exit 0 } else { exit 1 }"
  - id: gemini-md
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath GEMINI.md) { exit 0 } else { exit 1 }"
  - id: codex-skill
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath .codex/skills/opendock-dev-env/SKILL.md) { exit 0 } else { exit 1 }"
  - id: claude-skill
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath .claude/skills/opendock-dev-env/SKILL.md) { exit 0 } else { exit 1 }"
  - id: cursor-rule
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath .cursor/rules/opendock-dev-env.mdc) { exit 0 } else { exit 1 }"
  - id: mise-config
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath mise.toml) { exit 0 } else { exit 1 }"
  - id: dev-env-guide
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath .opendock/dev-env.md) { exit 0 } else { exit 1 }"
