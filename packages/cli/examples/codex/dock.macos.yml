opendock: 1
summary: Tool dock for installing the Codex CLI without project payloads.
readme: DOCK.md
logo: logo.png
tags:
  - codex
  - tool
  - ai-agent
requires:
  runtimes:
    node: ">=22.0.0"
    npm: ">=10.0.0"
tools:
  codex:
    manager: npm
    package: "@openai/codex"
    version: latest
    commands:
      - codex
doctor:
  - id: check-codex
    run: codex --version
