opendock: 1
summary: Test planning, regression, bug report, accessibility, and performance review templates.
readme: DOCK.md
logo: logo.png
tags:
  - qa
  - testing
  - accessibility
  - performance
files:
  - from: files/AGENTS.md
    to: AGENTS.md
  - from: files/CLAUDE.md
    to: CLAUDE.md
  - from: files/GEMINI.md
    to: GEMINI.md
  - from: files/.agents/skills/opendock-qa-engineer/SKILL.md
    to: .agents/skills/opendock-qa-engineer/SKILL.md
  - from: files/.codex/skills/opendock-qa-engineer/SKILL.md
    to: .codex/skills/opendock-qa-engineer/SKILL.md
  - from: files/.claude/skills/opendock-qa-engineer/SKILL.md
    to: .claude/skills/opendock-qa-engineer/SKILL.md
  - from: files/.cursor/rules/opendock-qa-engineer.mdc
    to: .cursor/rules/opendock-qa-engineer.mdc
  - from: files/PROMPTS.md
    to: PROMPTS.md
  - from: files/README.md
    to: README.md
  - from: files/TEST_PLAN.md
    to: TEST_PLAN.md
  - from: files/REGRESSION_CHECKLIST.md
    to: REGRESSION_CHECKLIST.md
  - from: files/BUG_REPORT.md
    to: BUG_REPORT.md
  - from: files/ACCESSIBILITY_CHECKLIST.md
    to: ACCESSIBILITY_CHECKLIST.md
  - from: files/PERFORMANCE_CHECKLIST.md
    to: PERFORMANCE_CHECKLIST.md
doctor:
  - id: agents-md
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath AGENTS.md) { exit 0 } else { exit 1 }"
  - id: claude-md
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath CLAUDE.md) { exit 0 } else { exit 1 }"
  - id: gemini-md
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath GEMINI.md) { exit 0 } else { exit 1 }"
  - id: codex-skill
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath .codex/skills/opendock-qa-engineer/SKILL.md) { exit 0 } else { exit 1 }"
  - id: claude-skill
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath .claude/skills/opendock-qa-engineer/SKILL.md) { exit 0 } else { exit 1 }"
  - id: cursor-rule
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath .cursor/rules/opendock-qa-engineer.mdc) { exit 0 } else { exit 1 }"
  - id: test-plan-md
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath TEST_PLAN.md) { exit 0 } else { exit 1 }"
  - id: regression-checklist-md
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath REGRESSION_CHECKLIST.md) { exit 0 } else { exit 1 }"
  - id: bug-report-md
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath BUG_REPORT.md) { exit 0 } else { exit 1 }"
  - id: prompts-md
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath PROMPTS.md) { exit 0 } else { exit 1 }"
