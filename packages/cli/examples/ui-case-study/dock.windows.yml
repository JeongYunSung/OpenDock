opendock: 1
id: opendock/ui-case-study
summary: Portfolio case study templates for problem, process, decision rationale, and impact.
readme: DOCK.md
logo: logo.png
tags:
  - portfolio
  - design
  - case-study
  - impact
files:
  - from: files/AGENTS.md
    to: AGENTS.md
  - from: files/CLAUDE.md
    to: CLAUDE.md
  - from: files/GEMINI.md
    to: GEMINI.md
  - from: files/.agents/skills/opendock-ui-case-study/SKILL.md
    to: .agents/skills/opendock-ui-case-study/SKILL.md
  - from: files/.codex/skills/opendock-ui-case-study/SKILL.md
    to: .codex/skills/opendock-ui-case-study/SKILL.md
  - from: files/.claude/skills/opendock-ui-case-study/SKILL.md
    to: .claude/skills/opendock-ui-case-study/SKILL.md
  - from: files/.cursor/rules/opendock-ui-case-study.mdc
    to: .cursor/rules/opendock-ui-case-study.mdc
  - from: files/PROMPTS.md
    to: PROMPTS.md
  - from: files/README.md
    to: README.md
  - from: files/CASE_STUDY_TEMPLATE.md
    to: CASE_STUDY_TEMPLATE.md
  - from: files/PROBLEM_DEFINITION.md
    to: PROBLEM_DEFINITION.md
  - from: files/IMPACT_MEASUREMENT.md
    to: IMPACT_MEASUREMENT.md
doctor:
  - id: agents-md
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath AGENTS.md) { exit 0 } else { exit 1 }"
  - id: claude-md
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath CLAUDE.md) { exit 0 } else { exit 1 }"
  - id: gemini-md
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath GEMINI.md) { exit 0 } else { exit 1 }"
  - id: codex-skill
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath .codex/skills/opendock-ui-case-study/SKILL.md) { exit 0 } else { exit 1 }"
  - id: claude-skill
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath .claude/skills/opendock-ui-case-study/SKILL.md) { exit 0 } else { exit 1 }"
  - id: cursor-rule
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath .cursor/rules/opendock-ui-case-study.mdc) { exit 0 } else { exit 1 }"
  - id: case-study-template
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath CASE_STUDY_TEMPLATE.md) { exit 0 } else { exit 1 }"
  - id: problem-definition
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath PROBLEM_DEFINITION.md) { exit 0 } else { exit 1 }"
  - id: impact-measurement
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath IMPACT_MEASUREMENT.md) { exit 0 } else { exit 1 }"
  - id: prompts
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath PROMPTS.md) { exit 0 } else { exit 1 }"
