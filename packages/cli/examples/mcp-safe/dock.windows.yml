opendock: 1
summary: Security-first MCP inventory, config examples, and review checklists.
readme: DOCK.md
logo: logo.png
tags:
  - mcp
  - security
  - config
  - review
files:
  - from: files/AGENTS.md
    to: AGENTS.md
  - from: files/CLAUDE.md
    to: CLAUDE.md
  - from: files/GEMINI.md
    to: GEMINI.md
  - from: files/.agents/skills/opendock-mcp-safe/SKILL.md
    to: .agents/skills/opendock-mcp-safe/SKILL.md
  - from: files/.codex/skills/opendock-mcp-safe/SKILL.md
    to: .codex/skills/opendock-mcp-safe/SKILL.md
  - from: files/.claude/skills/opendock-mcp-safe/SKILL.md
    to: .claude/skills/opendock-mcp-safe/SKILL.md
  - from: files/.cursor/rules/opendock-mcp-safe.mdc
    to: .cursor/rules/opendock-mcp-safe.mdc
  - from: files/README.md
    to: README.md
  - from: files/MCP.md
    to: MCP.md
  - from: files/.opendock/mcp/approved-servers.yml
    to: .opendock/mcp/approved-servers.yml
  - from: files/.opendock/mcp/security-checklist.md
    to: .opendock/mcp/security-checklist.md
  - from: files/.opendock/mcp/cursor.mcp.json
    to: .opendock/mcp/cursor.mcp.json
  - from: files/.opendock/mcp/claude.mcp.json
    to: .opendock/mcp/claude.mcp.json
  - from: files/.opendock/mcp/codex.config.example.toml
    to: .opendock/mcp/codex.config.example.toml
doctor:
  - id: agents-md
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath AGENTS.md) { exit 0 } else { exit 1 }"
  - id: claude-md
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath CLAUDE.md) { exit 0 } else { exit 1 }"
  - id: gemini-md
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath GEMINI.md) { exit 0 } else { exit 1 }"
  - id: codex-skill
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath .codex/skills/opendock-mcp-safe/SKILL.md) { exit 0 } else { exit 1 }"
  - id: claude-skill
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath .claude/skills/opendock-mcp-safe/SKILL.md) { exit 0 } else { exit 1 }"
  - id: cursor-rule
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath .cursor/rules/opendock-mcp-safe.mdc) { exit 0 } else { exit 1 }"
  - id: mcp-guide
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath MCP.md) { exit 0 } else { exit 1 }"
  - id: approved-servers
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath .opendock/mcp/approved-servers.yml) { exit 0 } else { exit 1 }"
  - id: security-checklist
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath .opendock/mcp/security-checklist.md) { exit 0 } else { exit 1 }"
  - id: codex-template
    check: powershell -NoProfile -NonInteractive -Command "if (Test-Path -LiteralPath .opendock/mcp/codex.config.example.toml) { exit 0 } else { exit 1 }"
