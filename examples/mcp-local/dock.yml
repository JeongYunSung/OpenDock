opendock: 1
id: opendock/mcp-local
summary: Safe project-local MCP configuration examples.
readme: DOCK.md
logo: logo.png

files:
  - from: files/MCP.md
    to: MCP.md
    update: managed_block

  - from: files/.opendock/mcp/cursor.mcp.json
    to: .opendock/mcp/cursor.mcp.json
    update: managed_file

  - from: files/.opendock/mcp/vscode.mcp.json
    to: .opendock/mcp/vscode.mcp.json
    update: managed_file

  - from: files/.opendock/mcp/claude.mcp.json
    to: .opendock/mcp/claude.mcp.json
    update: managed_file

  - from: files/.opendock/mcp/copilot.mcp.json
    to: .opendock/mcp/copilot.mcp.json
    update: managed_file

  - from: files/.opendock/mcp/codex.config.example.toml
    to: .opendock/mcp/codex.config.example.toml
    update: managed_file

lifecycle:
  doctor:
    - id: mcp-guide
      check: test -f MCP.md

    - id: cursor-mcp-template
      check: test -f .opendock/mcp/cursor.mcp.json

    - id: codex-mcp-template
      check: test -f .opendock/mcp/codex.config.example.toml
