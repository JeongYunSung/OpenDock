opendock: 1
id: opendock/oh-my-codex
version: 0.2.0
summary: Oh My Codex setup for Codex agent workflows.
readme: DOCK.md
logo: logo.jpg

lifecycle:
  install:
    - id: install-node
      check: node --version
      version: ">=22.0.0 <25.0.0"
      platforms:
        macos:
          run: brew install node
        windows:
          run: winget install --id OpenJS.NodeJS.LTS --exact --accept-package-agreements --accept-source-agreements

    - id: install-codex-cli
      check: codex --version
      version: ">=0.0.0"
      run: npm install --global @openai/codex@latest

    - id: install-oh-my-codex
      check: omx --version
      version: ">=0.18.0"
      run: npm install --global oh-my-codex@latest

    - id: setup-oh-my-codex
      run: omx setup
      timeout_ms: 600000

    - id: verify-oh-my-codex
      run: omx doctor
      timeout_ms: 60000

  update:
    - id: update-codex-cli
      run: npm install --global @openai/codex@latest

    - id: update-oh-my-codex
      run: omx update
      timeout_ms: 600000

    - id: verify-oh-my-codex
      run: omx doctor
      timeout_ms: 60000

  doctor:
    - id: node
      check: node --version
      version: ">=22.0.0 <25.0.0"

    - id: npm
      check: npm --version
      version: ">=10.0.0"

    - id: codex
      check: codex --version
      version: ">=0.0.0"

    - id: oh-my-codex-version
      check: omx --version
      version: ">=0.18.0"

    - id: oh-my-codex
      check: omx doctor
      timeout_ms: 60000
