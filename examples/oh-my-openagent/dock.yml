opendock: 1
id: opendock/oh-my-openagent
version: 0.2.0
summary: Oh My OpenAgent light setup for Codex workflows.
readme: DOCK.md
logo: logo.png

lifecycle:
  install:
    - id: install-node
      check: node --version
      version: ">=22.0.0 <25.0.0"
      platforms:
        macos:
          run: brew install node
        windows:
          run: winget install --id OpenJS.NodeJS.LTS --exact --accept-package-agreements --accept-source-agreements

    - id: install-codex-cli
      check: codex --version
      version: ">=0.0.0"
      run: npm install --global @openai/codex@latest

    - id: install-oh-my-openagent-light
      run: npx lazycodex-ai install --no-tui --codex-autonomous
      timeout_ms: 600000

  update:
    - id: update-codex-cli
      run: npm install --global @openai/codex@latest

    - id: update-oh-my-openagent-light
      run: npx lazycodex-ai install --no-tui --codex-autonomous
      timeout_ms: 600000

  doctor:
    - id: node
      check: node --version
      version: ">=22.0.0 <25.0.0"

    - id: npm
      check: npm --version
      version: ">=10.0.0"

    - id: codex
      check: codex --version
      version: ">=0.0.0"
