opendock: 1
id: opendock/git
version: 0.1.0

lifecycle:
  install:
    - id: install-git
      check: git --version
      version: ">=2.40.0"
      platforms:
        macos:
          run: brew install git
        windows:
          run: winget install --id Git.Git --exact --accept-package-agreements --accept-source-agreements

    - id: git-init
      check: git status
      run: git init -b main

  update:
    - id: update-git
      platforms:
        macos:
          run: brew upgrade git
        windows:
          run: winget upgrade --id Git.Git --exact --accept-package-agreements --accept-source-agreements

    - id: verify-git
      run: git --version
      timeout_ms: 60000

  doctor:
    - id: git
      check: git --version
      version: ">=2.40.0"

    - id: git-project
      check: git status
