opendock: 1
id: opendock/git
version: 0.1.0

lifecycle:
  install:
    - id: install-git
      check: git --version
      version: ">=2.40.0"
      run: brew install git

    - id: git-init
      check: git status
      run: git init -b main

  update:
    - id: update-git
      run: brew upgrade git

    - id: verify-git
      run: git --version
      timeout_ms: 60000

  doctor:
    - id: git
      check: git --version
      version: ">=2.40.0"

    - id: git-project
      check: git status
