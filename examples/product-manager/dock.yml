opendock: 1
id: opendock/product-manager
summary: AI workspace for PRDs, user stories, roadmaps, and releases.
readme: DOCK.md
logo: logo.png

files:
  - from: files/AGENTS.md
    to: AGENTS.md
    update: managed_block

  - from: files/CLAUDE.md
    to: CLAUDE.md
    update: managed_block

  - from: files/PRD.md
    to: PRD.md
    update: manual_review

  - from: files/USER_STORY.md
    to: USER_STORY.md
    update: manual_review

  - from: files/ROADMAP.md
    to: ROADMAP.md
    update: manual_review

  - from: files/RELEASE_NOTES.md
    to: RELEASE_NOTES.md
    update: manual_review

  - from: files/PROMPTS.md
    to: PROMPTS.md
    update: managed_block

  - from: files/README.md
    to: README.md
    update: manual_review

lifecycle:
  install:
    - id: install-git
      check: git --version
      version: ">=2.40.0"
      platforms:
        macos:
          run: brew install git
        windows:
          run: winget install --id Git.Git --exact --accept-package-agreements --accept-source-agreements

    - id: install-node
      check: node --version
      version: ">=22.0.0"
      platforms:
        macos:
          run: brew install node
        windows:
          run: winget install --id OpenJS.NodeJS.LTS --exact --accept-package-agreements --accept-source-agreements

    - id: install-codex-cli
      check: codex --version
      version: ">=0.0.0"
      run: npm install --global @openai/codex@latest

  update:
    - id: update-codex-cli
      run: npm install --global @openai/codex@latest

  doctor:
    - id: git
      check: git --version
      version: ">=2.40.0"

    - id: node
      check: node --version
      version: ">=22.0.0"

    - id: npm
      check: npm --version
      version: ">=10.0.0"

    - id: codex
      check: codex --version
      version: ">=0.0.0"

    - id: agents-md
      check: test -f AGENTS.md

    - id: claude-md
      check: test -f CLAUDE.md

    - id: prd-md
      check: test -f PRD.md

    - id: roadmap-md
      check: test -f ROADMAP.md
