opendock: 1
id: opendock/codex-skills
summary: Repository-local Codex skill pack for common workflows.
readme: DOCK.md
logo: logo.png

files:
  - from: files/.agents/skills
    to: .agents/skills
    update: managed_file

  - from: files/.opendock/codex-skills.md
    to: .opendock/codex-skills.md
    update: managed_file

lifecycle:
  doctor:
    - id: bugfix-skill
      check: test -f .agents/skills/opendock-bugfix/SKILL.md

    - id: review-skill
      check: test -f .agents/skills/opendock-review/SKILL.md

    - id: docs-skill
      check: test -f .agents/skills/opendock-docs/SKILL.md

    - id: skill-guide
      check: test -f .opendock/codex-skills.md
