opendock: 1
id: opendock/oma
version: 0.1.0
summary: Oh My Agent setup with interactive project bootstrap.
readme: DOCK.md
logo: logo.png

lifecycle:
  install:
    - id: install-bun
      check: bun --version
      version: ">=1.3.0"
      platforms:
        macos:
          run: brew install bun
        windows:
          run: npm install --global bun

    - id: install-oma-cli
      check: oma --version
      version: ">=8.43.0"
      run: bun install --global oh-my-agent@latest

    - id: apply-oma-project
      check: test -f .agents/oma-config.yaml
      interactive: user
      run: oma
      timeout_ms: 600000

    - id: verify-oma
      run: oma doctor
      timeout_ms: 60000

  update:
    - id: update-oma-cli
      run: bun install --global oh-my-agent@latest

    - id: update-oma-project
      interactive: user
      run: oma
      timeout_ms: 600000

    - id: verify-oma
      run: oma doctor
      timeout_ms: 60000

  doctor:
    - id: bun
      check: bun --version
      version: ">=1.3.0"

    - id: oma
      check: oma --version
      version: ">=8.43.0"
      repair: bun install --global oh-my-agent@latest

    - id: oma-project
      check: test -f .agents/oma-config.yaml

    - id: oma-doctor
      check: oma doctor
      timeout_ms: 60000
