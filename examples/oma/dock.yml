opendock: 1
id: opendock/oma
summary: Oh My Agent setup with OpenDock-managed install, update, and uninstall.
readme: DOCK.md
logo: logo.png

requires:
  runtimes:
    node: ">=22.0.0 <25.0.0"
    bun: ">=1.3.0"
  packages:
    oma:
      manager: bun
      name: oh-my-agent
      version: ">=8.43.0"

files:
  - from: files/AGENTS.md
    to: AGENTS.md
  - from: files/PROMPTS.md
    to: PROMPTS.md

lifecycle:
  install:
    - id: apply-oma
      check: test -f .agents/oma-config.yaml
      run: oma -y install
      workdir: dock
      export:
        include:
          - AGENTS.md
          - CLAUDE.md
          - GEMINI.md
          - QWEN.md
          - .agents/**
          - .codex/**
          - .claude/**
          - .cursor/**
          - .github/copilot-instructions.md
          - .github/instructions/**
          - .kiro/**
          - .qwen/**
        exclude:
          - "**/*.log"
          - "**/cache/**"
          - "**/.DS_Store"
      timeout_ms: 600000
  update:
    - id: update-oma
      run: oma -y update
      workdir: dock
      export:
        include:
          - AGENTS.md
          - CLAUDE.md
          - GEMINI.md
          - QWEN.md
          - .agents/**
          - .codex/**
          - .claude/**
          - .cursor/**
          - .github/copilot-instructions.md
          - .github/instructions/**
          - .kiro/**
          - .qwen/**
        exclude:
          - "**/*.log"
          - "**/cache/**"
          - "**/.DS_Store"
      timeout_ms: 600000
  doctor:
    - id: check-oma
      run: oma doctor
      workdir: root
      timeout_ms: 60000
    - id: check-agents
      run: test -f AGENTS.md
      workdir: root
