    check: test -f AGENTS.md
  - id: job-description-md
    check: test -f JOB_DESCRIPTION.md
  - id: interview-guide-md
    check: test -f INTERVIEW_GUIDE.md
  - id: scorecard-md
    check: test -f SCORECARD.md
  - id: prompts-md
